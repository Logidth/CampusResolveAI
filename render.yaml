services:
  - type: web
    name: campusresolveai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        fromDatabase:
          name: campusresolve-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: DEBUG_TIME_SCALE
        value: "720"
      - key: MOCK_MODE
        value: "false"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: BASE_URL
        value: https://campusresolveai.onrender.com
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false

databases:
  - name: campusresolve-db
    databaseName: campusresolve
    user: campusresolve_user
    plan: free
