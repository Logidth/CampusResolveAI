services:
  - type: web
    name: campusresolve
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: MOCK_MODE
        value: "false"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: dlogidth4@gmail.com
      - key: SMTP_PASSWORD
        value: nmfvdqbdaywmkmyb
      - key: SMTP_FROM_EMAIL
        value: dlogidth4@gmail.com
